# BURDEN by HOUSEPVA — Supabase project config (only the parts we change).
project_id = "burdenbypva"

# No donor login yet, and providers can't send a Supabase JWT, so each
# function does its own check: a per-gift token, a webhook signature,
# or CHURCH_ADMIN_KEY.
[functions.create-gift]
verify_jwt = false

[functions.gift-status]
verify_jwt = false

[functions.checkout-return]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.paystack-webhook]
verify_jwt = false

[functions.flutterwave-webhook]
verify_jwt = false

[functions.church-confirm]
verify_jwt = false

# Added 2026-10-22: mobile money approve-on-phone, monthly gifts, payouts, USSD.
# momo-otp / cancel-recurring check the gift or plan token; run-recurring and
# run-payouts check CRON_SECRET; church-payout-account checks CHURCH_ADMIN_KEY;
# ussd checks USSD_SHARED_SECRET.
[functions.momo-charge]
verify_jwt = false

[functions.momo-otp]
verify_jwt = false

[functions.cancel-recurring]
verify_jwt = false

[functions.run-recurring]
verify_jwt = false

[functions.run-payouts]
verify_jwt = false

[functions.church-payout-account]
verify_jwt = false

[functions.ussd]
verify_jwt = false

# Added 2026-10-24: words of support review queue.
[functions.support-messages]
verify_jwt = false

[functions.moderation-queue]
verify_jwt = false

# Added 2026-10-24: refunds, sanctions screening, Gift Aid export.
[functions.request-refund]
verify_jwt = false

[functions.sanctions-refresh]
verify_jwt = false

[functions.screening-queue]
verify_jwt = false

[functions.gift-aid-export]
verify_jwt = false

# Added 2026-10-25: church accounts and notifications. `church` checks the
# signed-in user's Supabase token itself (and church membership), so the
# gateway check is off like the others.
[functions.church]
verify_jwt = false

[functions.burden-updates]
verify_jwt = false

[functions.notify-sweep]
verify_jwt = false

[functions.push-register]
verify_jwt = false

[functions.unsubscribe]
verify_jwt = false

# Added 2026-10-26: giver accounts, fundraisers on the server, church
# applications, reports and the admin console. `account` and `admin` check the
# signed-in user's token themselves (admin also accepts CHURCH_ADMIN_KEY).
[functions.account]
verify_jwt = false

[functions.fundraisers]
verify_jwt = false

[functions.burden-content]
verify_jwt = false

[functions.church-apply]
verify_jwt = false

[functions.report]
verify_jwt = false

[functions.admin]
verify_jwt = false
